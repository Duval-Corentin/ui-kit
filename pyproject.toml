[project]
name = "ui-kit"
version = "0.3.0"
description = "Charte graphique commune de la plateforme (CSS + gabarits Jinja)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ui_kit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
